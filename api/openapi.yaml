openapi: 3.0.3
info:
  title: Inventory Management API
  version: 0.4.0
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid credentials / account disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/register:
    post:
      summary: Register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Register result (also logs in)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/refresh:
    post:
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid/expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/me:
    get:
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/v1/auth/logout:
    post:
      summary: Logout (revoke refresh tokens)
      responses:
        "200":
          description: Logged out
  /api/v1/auth/change-password:
    post:
      summary: Change password (revokes refresh tokens)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed
  /api/v1/stores:
    get:
      summary: List stores (optionally nearby)
      parameters:
        - in: query
          name: lat
          required: false
          schema:
            type: number
            format: double
        - in: query
          name: lng
          required: false
          schema:
            type: number
            format: double
        - in: query
          name: radiusKm
          required: false
          schema:
            type: number
            format: double
        - in: query
          name: radiusMi
          required: false
          schema:
            type: number
            format: double
        - in: query
          name: city
          required: false
          schema:
            type: string
        - in: query
          name: state
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: Stores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoreResponse"
    post:
      summary: Create store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStoreRequest"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Conflict (duplicate store code)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/stores/{id}:
    get:
      summary: Get store by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/products:
    get:
      summary: Search products
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductResponse"
    post:
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Conflict (duplicate SKU/barcode)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/products/{id}:
    get:
      summary: Get product by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/products/by-barcode/{barcode}:
    get:
      summary: Get product by barcode
      parameters:
        - in: path
          name: barcode
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/products/by-barcode/{barcode}/availability:
    get:
      summary: Get product availability for current + nearby stores
      parameters:
        - in: path
          name: barcode
          required: true
          schema:
            type: string
        - in: query
          name: storeId
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: lat
          required: false
          schema:
            type: number
            format: double
        - in: query
          name: lng
          required: false
          schema:
            type: number
            format: double
        - in: query
          name: radiusKm
          required: false
          schema:
            type: number
            format: double
        - in: query
          name: radiusMi
          required: false
          schema:
            type: number
            format: double
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: Availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductAvailabilityResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/inventory/{storeId}/{productId}:
    get:
      summary: Get inventory status for a product in a store
      parameters:
        - in: path
          name: storeId
          required: true
          schema:
            type: integer
            format: int64
        - in: path
          name: productId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Inventory status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryStatusResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/inventory/adjust:
    post:
      summary: Adjust inventory (delta)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustInventoryRequest"
      responses:
        "200":
          description: Inventory status after adjustment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryStatusResponse"
        "400":
          description: Validation / negative stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        storeId:
          type: integer
          format: int64
          nullable: true
      required: [email, password]
    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required: [refreshToken]
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
      required: [currentPassword, newPassword]
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresInSeconds:
          type: integer
          format: int64
        user:
          $ref: "#/components/schemas/UserResponse"
      required: [accessToken, refreshToken, expiresInSeconds, user]
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        role:
          type: string
          enum: [EMPLOYEE, MANAGER]
        storeId:
          type: integer
          format: int64
          nullable: true
        storeName:
          type: string
          nullable: true
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, email, role, active, createdAt]
    ApiError:
      type: object
      properties:
        message:
          type: string
        timestamp:
          type: string
          format: date-time
      required: [message, timestamp]
    CreateStoreRequest:
      type: object
      properties:
        code:
          type: string
          maxLength: 32
        name:
          type: string
          maxLength: 255
        address:
          type: string
          maxLength: 255
          nullable: true
        city:
          type: string
          maxLength: 128
          nullable: true
        state:
          type: string
          maxLength: 32
          nullable: true
        postalCode:
          type: string
          maxLength: 32
          nullable: true
        country:
          type: string
          maxLength: 2
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
      required: [code, name]
    StoreResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        postalCode:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        distanceKm:
          type: number
          format: double
          nullable: true
        distanceMi:
          type: number
          format: double
          nullable: true
      required: [id, code, name, createdAt, updatedAt]
    CreateProductRequest:
      type: object
      properties:
        sku:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 255
        barcode:
          type: string
          maxLength: 128
          nullable: true
        category:
          type: string
          maxLength: 128
          nullable: true
        price:
          type: number
          format: double
          nullable: true
      required: [sku, name]
    ProductResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        sku:
          type: string
        name:
          type: string
        barcode:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        price:
          type: number
          format: double
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, sku, name, createdAt, updatedAt]
    AdjustInventoryRequest:
      type: object
      properties:
        storeId:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        delta:
          type: integer
          format: int64
        reason:
          type: string
          maxLength: 255
          nullable: true
      required: [storeId, productId, delta]
    InventoryMovementResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        delta:
          type: integer
          format: int64
        reason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, delta, createdAt]
    InventoryStatusResponse:
      type: object
      properties:
        storeId:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int64
        recentMovements:
          type: array
          items:
            $ref: "#/components/schemas/InventoryMovementResponse"
      required: [storeId, productId, quantity, recentMovements]
    StoreAvailabilityResponse:
      type: object
      properties:
        storeId:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        distanceKm:
          type: number
          format: double
          nullable: true
        distanceMi:
          type: number
          format: double
          nullable: true
        quantity:
          type: integer
          format: int64
        current:
          type: boolean
      required: [storeId, code, name, quantity, current]
    ProductAvailabilityResponse:
      type: object
      properties:
        product:
          $ref: "#/components/schemas/ProductResponse"
        stores:
          type: array
          items:
            $ref: "#/components/schemas/StoreAvailabilityResponse"
      required: [product, stores]
